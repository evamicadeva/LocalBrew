server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/localbrew_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

jwt.secret=${JWT_SECRET:local-dev-secret-change-me-local-dev-secret-change-me}
jwt.expiration=${JWT_EXPIRATION:86400000}

upload.base-path=${UPLOAD_BASE_PATH:uploads}
upload.base-url=${UPLOAD_BASE_URL:http://localhost:8080/uploads}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false

# Upload immagini
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
