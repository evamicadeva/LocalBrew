<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard proprietario - Local Brew</title>

  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/auth.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body class="auth-page">
  <main class="auth-shell">
    <a href="../index.html" class="auth-logo">
      <img src="../icons/full.png" alt="Local Brew">
    </a>

    <section class="auth-card">
      <h1>Nuovo locale</h1>
      <p>Invia un locale da far approvare agli amministratori.</p>

      <form class="auth-form" id="venue-form">
        <label for="venue-name">Nome locale</label>
        <input id="venue-name" type="text" required>

        <label for="venue-description">Descrizione</label>
        <textarea id="venue-description" rows="4"></textarea>

        <label for="venue-city">Citta</label>
        <input id="venue-city" type="text" required>

        <label for="venue-address">Indirizzo</label>
        <input id="venue-address" type="text" required>

        <label for="venue-type">Tipo locale</label>
        <select id="venue-type" required>
          <option value="BAR">Bar</option>
          <option value="PUB">Pub</option>
          <option value="BREWERY">Birrificio</option>
          <option value="RESTAURANT">Ristorante</option>
          <option value="BEER_STORE">Beer store</option>
        </select>

        <label for="venue-latitude">Latitudine</label>
        <input id="venue-latitude" type="number" step="any" required>

        <label for="venue-longitude">Longitudine</label>
        <input id="venue-longitude" type="number" step="any" required>

        <label for="venue-image-uri">URL immagine</label>
        <input id="venue-image-uri" type="url" placeholder="https://.../foto.jpg">

        <button type="submit" class="auth-submit">Crea locale</button>
      </form>

      <p class="auth-switch">
        <a href="../index.html">Torna alla mappa</a>
      </p>
    </section>
  </main>

  <script type="module" src="../js/owner-dashboard.js"></script>
</body>

</html>
